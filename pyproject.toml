[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fancy-tracker"
version = "0.1.0"
description = "Per-monitor cursor memory driven by webcam head tracking (macOS)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pyobjc-framework-Quartz",
]

[project.scripts]
fancy-tracker = "fancy_tracker.cli:main"

[tool.setuptools]
packages = ["fancy_tracker"]

[tool.ruff]
line-length = 100
